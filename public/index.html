<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4b400">
<title>🐝 GoBees</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

<div id="login-screen" class="screen">
  <h1>🐝 GoBees</h1>

  <input id="username" type="text" placeholder="Username" autocomplete="username" inputmode="text">
  <input id="password" type="password" placeholder="Password" autocomplete="current-password">

  <button type="button" onclick="login()">Login</button>
  <button type="button" class="btn-secondary" onclick="show('register')">Register</button>
  <button type="button" class="btn-secondary" onclick="guest()">Play as Guest</button>
</div>

<div id="register-screen" class="screen hidden">
  <h1>🐝 Create account</h1>

  <input id="regUsername" type="text" placeholder="Username" autocomplete="username" inputmode="text">
  <input id="regNickname" type="text" placeholder="Nickname (display name)" autocomplete="nickname">
  <input id="regEmail" type="email" placeholder="Email" autocomplete="email" inputmode="email">
  <input id="regPassword" type="password" placeholder="Password" autocomplete="new-password">

  <button type="button" onclick="register()">Create account</button>
  <button type="button" class="btn-secondary" onclick="show('login')">Back to login</button>
</div>

<div id="menu-screen" class="screen hidden">
  <h2 id="nickname"></h2>
  <div id="rank"></div>
  <div id="trophies"></div>

  <h3>🎮 Game Modes</h3>
  <button onclick="showDifficulty()">Play vs PC</button>
  <button onclick="showRooms()">Play with Friends</button>
  <button onclick="openRandomSetup()">Play Random</button>

  <h3>👤 Profile</h3>
  <button onclick="showProfile()">Profile</button>

  <button onclick="logout()">Logout</button>
</div>

<div id="difficulty-screen" class="screen hidden">
  <h2>Select Difficulty</h2>
  <button onclick="startPcGame('easy')">Easy</button>
  <button onclick="startPcGame('medium')">Medium</button>
  <button onclick="startPcGame('hard')">Hard</button>
  <button onclick="show('menu')">Back</button>
</div>

<div id="game-screen" class="screen hidden">
  <h3 id="gameModeTitle"></h3>
  <h2 id="timer">60</h2>

  <div id="letters"></div>

  <input id="wordInput" type="text" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" enterkeyhint="done">
  <div class="game-actions">
    <button type="button" onclick="submitWord()">Enter</button>
    <button type="button" class="btn-secondary" onclick="deleteLastLetter()">Delete last letter</button>
  </div>
  <div id="message"></div>

  <h3 id="score">0</h3>
  <div id="gameOpponentScore"></div>
  <div id="gameOpponentWords"></div>
</div>

<div id="rooms-screen" class="screen hidden">
  <h2>Play with Friends</h2>

  <h3>Duration</h3>
  <button onclick="selectFriendDuration(60)">1 minute</button>
  <button onclick="selectFriendDuration(180)">3 minutes</button>
  <button onclick="selectFriendDuration(300)">5 minutes</button>
  <button onclick="selectFriendDuration(600)">10 minutes</button>
  <button onclick="selectFriendDuration(1200)">20 minutes</button>
  <div id="friendDurationLabel">Selected: 1 min</div>

  <h3>Room</h3>

  <button onclick="createRoom()">Create Room</button>

  <input id="roomCode" placeholder="Enter Code">
  <button onclick="joinRoom()">Join</button>
  <button onclick="startFriendRoomGame()">Start Room Game</button>
  <button onclick="leaveRoom()">Leave Room</button>
  <div id="roomStatus"></div>
  <div id="roomPlayers"></div>

  <button onclick="show('menu')">Back</button>
</div>

<div id="random-screen" class="screen hidden">
  <h2>Random Ranked Match</h2>
  <button onclick="setRandomSize(2)">1v1 (2 players)</button>
  <button onclick="setRandomSize(5)">You vs 4 others</button>
  <button onclick="setRandomSize(10)">You vs 9 others</button>
  <div id="randomModeLabel">Selected: 2 players</div>
  <button onclick="startRandomMatch()">Start Ranked Match</button>
  <button onclick="show('menu')">Back</button>
</div>

<div id="result-screen" class="screen hidden">
  <h2 id="resultTitle"></h2>
  <h3 id="resultSubtitle"></h3>
  <pre id="resultBody"></pre>
  <button onclick="show('menu')">Back to Menu</button>
</div>

<div id="profile-screen" class="screen hidden">
  <h2 id="profileName"></h2>
  <div id="profileRank"></div>

  <h3>Achievements</h3>
  <ul id="achievements"></ul>

  <button onclick="show('menu')">Back</button>
</div>

</div>

<script src="script.js"></script>
</body>
</html>
